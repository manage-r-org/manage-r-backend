version: '3.9'

# ──────────────────────────────────────────────────────────────
# Manage-R — Docker Compose (Development only)
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: manage_r_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manage_r_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional UI) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: manage_r_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@manage-r.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── API (development) ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # use builder stage so we can override the command
    container_name: manage_r_api
    restart: unless-stopped
    command: ['node', '-r', 'tsconfig-paths/register', '-r', 'ts-node/register', 'src/main.ts']
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/manage_r_db?schema=public
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
